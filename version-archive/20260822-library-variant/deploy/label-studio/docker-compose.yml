services:
  label-studio:
    image: ${LABEL_STUDIO_IMAGE:-local/label-studio:1.23.0}
    pull_policy: never
    container_name: ningbo-sop-label-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
      SENTRY_DSN: ""
      FRONTEND_SENTRY_DSN: ""
      SENTRY_RATE: "0"
      FRONTEND_SENTRY_RATE: "0"
      LATEST_VERSION_CHECK: "false"
      CONVERTER_DOWNLOAD_RESOURCES: "false"
    volumes:
      - ./data:/label-studio/data
      - ../../web/media:/label-studio/files:ro
      - ../../runtime/label_studio_imports:/label-studio/imports
